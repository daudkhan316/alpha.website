<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08061a"/>
      <stop offset="100%" stop-color="#1a0d3a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="55%" stop-color="#764ba2"/>
      <stop offset="100%" stop-color="#f093fb"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f093fb" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#764ba2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="900" cy="315" r="320" fill="url(#halo)"/>
  <circle cx="220" cy="180" r="200" fill="url(#halo)" opacity="0.6"/>

  <text x="80" y="200" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="22" font-weight="500" letter-spacing="6" fill="#a78bfa"
        text-transform="uppercase">KLAUS · ALPHA PLATFORM</text>

  <text x="80" y="320" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="84" font-weight="600" fill="#ffffff" letter-spacing="-1.5">One platform.</text>
  <text x="80" y="410" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="84" font-weight="600" fill="url(#brand)" letter-spacing="-1.5">Every step of the</text>
  <text x="80" y="500" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="84" font-weight="600" fill="url(#brand)" letter-spacing="-1.5">insurance business.</text>

  <text x="80" y="570" font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="20" letter-spacing="2" fill="#94a3b8">Hosted in Microsoft Azure Germany · ISO 27001 · SOC 2 · GDPR</text>
</svg>
